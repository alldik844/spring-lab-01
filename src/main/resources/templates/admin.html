
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Panel - Spring Lab 10</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 35px;
            color: #222;
        }

        .container {
            max-width: 950px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            color: #202c43;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 13px;
            text-align: left;
        }

        th {
            background: #e9edf5;
        }

        .links {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }

        .status {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Administration Panel</h1>

    <p>
        Spring Security - Laboratory Work 10
    </p>

    <p>
        Logged in as:
        <strong th:text="${username}">
            admin
        </strong>
    </p>

    <h2>Registered Users</h2>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Roles</th>
            <th>Enabled</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="user : ${users}">

            <td th:text="${user.id}">1</td>

            <td th:text="${user.username}">
                username
            </td>

            <td th:text="${user.roles}">
                [USER]
            </td>

            <td class="status"
                th:text="${user.enabled}">
                true
            </td>

        </tr>
        </tbody>
    </table>

    <div class="links">

        <a th:href="@{/books}">
            Back to Books
        </a>

        <form th:action="@{/logout}"
              method="post">

            <button type="submit">
                Logout
            </button>

        </form>
    </div>

</div>

</body>
</html>
